name: Build Single Extension

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DragonTranslation APK
        run: ./gradlew :src:es:dragontranslationorg:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonTranslation-APK
          path: "**/build/outputs/apk/debug/*.apk"
