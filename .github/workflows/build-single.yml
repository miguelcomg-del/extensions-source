name: Build Single Extension

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Extension APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build TempleScan APK
        run: |
          ./gradlew :src:es:templescanesp:assembleDebug -x spotlessKotlinCheck -x spotlessCheck

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TempleScan-APK
          path: 'src/es/templescanesp/build/outputs/apk/debug/*.apk'
